name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "dev/v*"
      - "release/*"

permissions:
  contents: read

jobs:
  test-build-smoke:
    name: Test, build, and smoke install (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "ruff==0.17.0" "mypy==2.4.0" pytest build "twine>=7.0.0"
          python -m pip check

      - name: Lint with Ruff
        run: python -m ruff check .

      - name: Type check with mypy
        run: python -m mypy

      - name: Run tests
        run: python -m pytest tests -p no:cacheprovider --basetemp "$RUNNER_TEMP/chemvault-pytest"

      - name: Check source-install CLI and distribution version
        shell: bash
        run: |
          set -euo pipefail
          chemvault --help > /dev/null
          EXPECTED_VERSION="$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])')"
          test "$(chemvault --version)" = "ChemVault $EXPECTED_VERSION"
          python -c 'import importlib.metadata as metadata, pathlib, tomllib; expected = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]; assert metadata.version("ChemVault") == expected'

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: python -m twine check --strict dist/*

      - name: Inspect distribution contents
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          from tarfile import open as tar_open
          from zipfile import ZipFile

          distribution_directory = Path("dist")
          wheels = list(distribution_directory.glob("*.whl"))
          source_distributions = list(distribution_directory.glob("*.tar.gz"))
          assert len(wheels) == 1, f"Expected one wheel, found: {wheels}"
          assert len(source_distributions) == 1, (
              f"Expected one source distribution, found: {source_distributions}"
          )

          required_files = {
              "app.py",
              ".streamlit/config.toml",
              "docs/assets/logo_cyan.svg",
          }

          for artifact in (*wheels, *source_distributions):
              if artifact.suffix == ".whl":
                  with ZipFile(artifact) as archive:
                      names = archive.namelist()
              else:
                  with tar_open(artifact, "r:gz") as archive:
                      names = archive.getnames()

              for required_file in required_files:
                  assert any(
                      name == required_file or name.endswith(f"/{required_file}")
                      for name in names
                  ), f"{artifact.name} is missing {required_file}"

              for name in names:
                  path = PurePosixPath(name)
                  assert not (
                      path.suffix.lower() in {".db", ".sqlite", ".sqlite3"}
                      or any(part.lower() == "sql" for part in path.parts)
                  ), f"{artifact.name} contains a SQLite database path: {name}"
          PY

      - name: Smoke install built wheel
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_VERSION="$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])')"
          export EXPECTED_VERSION
          WHEEL="$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$WHEEL"
          TEMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TEMP_DIR"' EXIT
          python -m venv "$TEMP_DIR/venv"
          "$TEMP_DIR/venv/bin/python" -m pip install --upgrade pip
          "$TEMP_DIR/venv/bin/python" -m pip install "$WHEEL"
          "$TEMP_DIR/venv/bin/python" -m pip check
          mkdir "$TEMP_DIR/workspace"
          cd "$TEMP_DIR/workspace"
          "$TEMP_DIR/venv/bin/chemvault" --help > /dev/null
          test "$("$TEMP_DIR/venv/bin/chemvault" --version)" = "ChemVault $EXPECTED_VERSION"
          "$TEMP_DIR/venv/bin/python" -I - <<'PY'
          import importlib.metadata as metadata
          import os
          from pathlib import Path
          from ui import launcher, sidebar

          version = metadata.version("ChemVault")
          assert version == os.environ["EXPECTED_VERSION"]
          app = launcher._resolve_app_path()
          assert app.is_file()
          assert (app.parent / ".streamlit" / "config.toml").is_file()
          assert (app.parent / "docs" / "assets" / "logo_cyan.svg").is_file()
          assert "site-packages" in str(Path(launcher.__file__).resolve())
          assert sidebar.resolve_application_version() == version
          assert not (Path.cwd() / "SQL").exists()
          installed_files = metadata.files("ChemVault")
          assert installed_files is not None
          assert not any(path.suffix == ".db" or "SQL" in path.parts for path in installed_files)
          print(f"Installed wheel: ChemVault {version} OK")
          PY

      - name: Smoke install source distribution
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_VERSION="$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])')"
          export EXPECTED_VERSION
          SDIST="$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -n "$SDIST"
          TEMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TEMP_DIR"' EXIT
          python -m venv "$TEMP_DIR/venv"
          "$TEMP_DIR/venv/bin/python" -m pip install --upgrade pip
          "$TEMP_DIR/venv/bin/python" -m pip install "$SDIST"
          "$TEMP_DIR/venv/bin/python" -m pip check
          mkdir "$TEMP_DIR/workspace"
          cd "$TEMP_DIR/workspace"
          "$TEMP_DIR/venv/bin/chemvault" --help > /dev/null
          test "$("$TEMP_DIR/venv/bin/chemvault" --version)" = "ChemVault $EXPECTED_VERSION"
          "$TEMP_DIR/venv/bin/python" -I - <<'PY'
          import importlib.metadata as metadata
          import os
          from pathlib import Path
          from ui import launcher, sidebar

          version = metadata.version("ChemVault")
          assert version == os.environ["EXPECTED_VERSION"]
          app = launcher._resolve_app_path()
          assert app.is_file()
          assert (app.parent / ".streamlit" / "config.toml").is_file()
          assert (app.parent / "docs" / "assets" / "logo_cyan.svg").is_file()
          assert "site-packages" in str(Path(launcher.__file__).resolve())
          assert sidebar.resolve_application_version() == version
          assert not (Path.cwd() / "SQL").exists()
          installed_files = metadata.files("ChemVault")
          assert installed_files is not None
          assert not any(path.suffix == ".db" or "SQL" in path.parts for path in installed_files)
          print(f"Installed sdist: ChemVault {version} OK")
          PY

  docs-build:
    name: Build documentation (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs]"

      - name: Build MkDocs site
        run: python -m mkdocs build --strict

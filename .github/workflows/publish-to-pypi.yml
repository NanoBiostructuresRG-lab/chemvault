# SPDX-License-Identifier: LGPL-3.0-or-later
name: Publish Python package to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build and validate distributions
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}

    steps:
      - name: Validate release tag format
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must use the strict vX.Y.Z format." >&2
            exit 1
          fi

      - name: Check out release tag
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Verify release tag and package version
        shell: bash
        run: |
          set -euo pipefail
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")"

          PACKAGE_VERSION="$(python - <<'PY'
          from pathlib import Path
          import tomllib

          with Path("pyproject.toml").open("rb") as project_file:
              metadata = tomllib.load(project_file)

          version = metadata["project"]["version"]
          if not isinstance(version, str) or not version or version != version.strip():
              raise SystemExit("pyproject.toml contains an invalid project version")
          print(version)
          PY
          )"

          TAG_VERSION="${RELEASE_TAG#v}"
          if [[ "$PACKAGE_VERSION" != "$TAG_VERSION" ]]; then
            echo "Release tag $RELEASE_TAG does not match package version $PACKAGE_VERSION." >&2
            exit 1
          fi

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build "twine>=7.0.0"

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          distribution_directory = Path("dist")
          wheels = list(distribution_directory.glob("*.whl"))
          source_distributions = list(distribution_directory.glob("*.tar.gz"))
          if len(wheels) != 1 or len(source_distributions) != 1:
              raise SystemExit(
                  "Expected exactly one wheel and one source distribution; "
                  f"found wheels={wheels}, source_distributions={source_distributions}"
              )
          PY
          python -m twine check --strict dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distribution to PyPI
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/chemvault

    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
